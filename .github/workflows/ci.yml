name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # CI 只运行无需专用环境的快速回归；本地 pytest 默认运行全量测试。
      - run: uv run pytest -m "not gpu and not docker and not vllm and not system and not external_assets"
