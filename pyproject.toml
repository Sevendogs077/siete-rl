[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "swe-agent"
version = "0.1.0"
description = "基于 TRL 的 SWE-Gym GRPO 训练项目"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.14.0",
  "bitsandbytes==0.49.2",
  "datasets==5.0.0",
  "jmespath==1.1.0",
  "peft==0.19.1",
  "pyarrow==25.0.0",
  "pydantic==2.13.4",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
  "transformers==5.13.0",
  "trl==1.8.0",
  "vllm==0.22.1+cu129",
]

[project.scripts]
swe-agent = "swe_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not gpu and not docker and not vllm and not system'"
markers = [
  "gpu: 需要显式选择 GPU 的测试",
  "docker: 访问固定 SWE-Gym Docker 镜像的测试",
  "vllm: 启动真实 vLLM 后端的测试",
  "system: 执行真实 SWE/GRPO 系统闭环的测试",
]

[tool.uv]
package = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
vllm = { index = "vllm-cu129" }

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.22.1/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
