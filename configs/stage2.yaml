schema_version: 2
dataset:
  train_path: data/swegym/train.parquet
  tasks_dir: assets/swegym
  stage: 2
  exclude_task_ids:
    - Project-MONAI__MONAI-763
    - Project-MONAI__MONAI-3619
    - Project-MONAI__MONAI-5486
    - Project-MONAI__MONAI-5543
    - Project-MONAI__MONAI-6034
    - Project-MONAI__MONAI-6147
    - Project-MONAI__MONAI-6405
    - Project-MONAI__MONAI-6924
    - Project-MONAI__MONAI-7548
    - bokeh__bokeh-13289
    - bokeh__bokeh-13318
    - getmoto__moto-5110
    - getmoto__moto-5338
    - getmoto__moto-6107
    - getmoto__moto-6724
    - getmoto__moto-7317
    - iterative__dvc-6811
    - pandas-dev__pandas-47619
    - pandas-dev__pandas-49794
    - pandas-dev__pandas-50759
    - python__mypy-11162
docker:
  platform: linux/amd64
  pull_policy: never
  network_mode: none
  host_mounts: false
  cpus: 4.0
  memory: 16g
  pids_limit: 512
  exec_timeout_sec: 300
  verifier_timeout_sec: 3600
model:
  provenance_id: NovaSky-AI/SWE-Gym-OpenHands-7B-Agent
  model_path: ~/.cache/modelscope/hub/models/NovaSky-AI/SWE-Gym-OpenHands-7B-Agent
  tokenizer_path: ~/.cache/modelscope/hub/models/NovaSky-AI/SWE-Gym-OpenHands-7B-Agent
  adapter_path: null
  architecture: Qwen2ForCausalLM
  context_length: 32768
  trust_remote_code: true
  dtype: bfloat16
  training_mode: lora
quantization:
  load_in_4bit: false
  bnb_4bit_quant_type: null
  bnb_4bit_compute_dtype: null
  bnb_4bit_use_double_quant: null
peft:
  task_type: CAUSAL_LM
  rank: 32
  alpha: 32
  dropout: 0.0
  bias: none
  target_modules: all-linear
  modules_to_save: null
chat:
  max_prompt_length: 8192
  max_observation_chars: 10000
generation:
  max_completion_length: 24576
  context_safety_margin: 0
  use_liger_kernel: true
  max_tool_calling_iterations: 40
  max_consecutive_protocol_errors: 5
  reset_parallel_workers: 16
  tool_parallel_workers: 16
  verifier_parallel_workers: 2
  use_process_mask: true
  temperature: 1.0
  top_p: 1.0
  top_k: 20
  repetition_penalty: 1.1
grpo:
  reward_type: layered
  layered_reward_cap: 0.20
  extra_reference_rewards: [1.0]
  num_generations: 8
  num_iterations: 1
  loss_type: dr_grpo
  scale_rewards: none
  multi_objective_aggregation: sum_then_normalize
  epsilon: 0.16
  epsilon_high: 0.24
  delta: null
  beta: 0.0
  importance_sampling_level: token
  router_aux_loss_coef: 0.0
  shuffle_dataset: true
  vllm_importance_sampling_correction: true
  vllm_importance_sampling_mode: token_truncate
  vllm_importance_sampling_clip_max: 3.0
  vllm_importance_sampling_clip_min: null
  num_train_epochs: 1
  train_batch_size: 2
  learning_rate: 1.0e-05
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 5
  save_total_limit: 3
  log_completions: false
  report_to: []
wandb:
  enabled: false
  project: siete-rl
  entity: null
  mode: online
  group: swegym-openhands-7b-grpo
  tags: [grpo, swegym, openhands, lora]
  notes: null
vllm:
  use_vllm: true
  mode: colocate
  model_impl: vllm
  enable_sleep_mode: true
  tensor_parallel_size: 4
  server_base_url: null
  gpu_memory_utilization: 0.20
  max_model_length: 32768
runtime:
  runtime_qualified: true
  process_count: 4
  base_seed: 42
  distributed_timeout_sec: 1800
output:
  output_root: outputs
  run_id: null
  train_log: train.log
